name: Foundation checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      CI: true
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Lint, typecheck, and test
        run: npm run check
      - name: Test backend
        working-directory: backend
        run: npm test
      - name: Build and smoke-test backend image
        working-directory: backend
        run: npm run test:container
      - name: Test backend with PostGIS and Redis
        working-directory: backend
        run: npm run test:integration:docker
      # This checks JavaScript and assets only; it is not an installable Android build.
      - name: Bundle Android JavaScript
        run: npm run bundle:android
